# v20261008 deploy-multistep-drupal11

parameters:
  - name: group
    type: string
  - name: subscription
    type: string
  - name: image
    type: string
  - name: appname
    type: string
  - name: acr
    type: string
  - name: acrSubscription
    type: string
  - name: commitHash
    type: string
  - name: slackWebhook
    type: string
  - name: skipSteps
    type: string
    default: ''
  - name: baseVersion
    type: string
    default: deploy-multistep-drupal11

steps:
  - task: CmdLine@2
    displayName: "Clean builder"
    inputs:
      script: |
        echo "=== Disque avant nettoyage ==="
        df -h "$(Agent.WorkFolder)" /var/lib/docker 2>/dev/null || df -h
        docker system df
        docker system prune --all --force --volumes
        echo "=== Disque après nettoyage ==="
        df -h "$(Agent.WorkFolder)" /var/lib/docker 2>/dev/null || df -h
        docker system df

  - task: CmdLine@2
    displayName: "Install composer deps (private repos)"
    env:
      GITHUB_TOKEN: $(GITHUB_TOKEN)
      BASE_VERSION: ${{ parameters.baseVersion }}
    inputs:
      script: |
        # Unresolved variable stays as a literal macro string (dollar, parenthesis,
        # name); never write the full macro here or Azure substitutes the secret.
        case "$GITHUB_TOKEN" in
        ""|'$('*)
          echo "##vso[task.logissue type=error]GITHUB_TOKEN variable is not defined in the pipeline (required for composer private repos)." >&2
          exit 1
          ;;
        esac
        # Header sent via stdin (printf is a builtin): token stays out of ps.
        HTTP_CODE=$(printf 'Authorization: Bearer %s\n' "$GITHUB_TOKEN" | \
          curl -s -o /dev/null -w '%{http_code}' -H @- \
          https://api.github.com/user) || HTTP_CODE=000
        if [ "$HTTP_CODE" != "200" ]; then
          echo "##vso[task.logissue type=error]GITHUB_TOKEN is invalid or expired (GitHub API returned HTTP $HTTP_CODE)." >&2
          exit 1
        fi
        BASE_IMAGE="ghcr.io/puppets-developpement-toolbox/drupal-azure-base:$BASE_VERSION"
        COMPOSER_CACHE="${AGENT_WORKFOLDER:-$HOME}/.cache/composer-build"
        mkdir -p "$COMPOSER_CACHE"
        # Passed by name only: keeps the token out of the process list.
        export COMPOSER_AUTH="{\"github-oauth\":{\"github.com\":\"$GITHUB_TOKEN\"}}"
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          --entrypoint composer \
          -e HOME=/tmp \
          -v "$PWD:/build" -w /build \
          -v "$COMPOSER_CACHE:/tmp/composer-cache" \
          -e COMPOSER_CACHE_DIR=/tmp/composer-cache \
          -e COMPOSER_AUTH \
          "$BASE_IMAGE" \
          install --no-dev -o --no-progress --prefer-dist

  - task: Docker@0
    displayName: Build
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      azureContainerRegistry: '{"loginServer":"${{ parameters.acr }}.azurecr.io", "id" : "/subscriptions/${{ parameters.acrSubscription }}/resourceGroups/${{ parameters.group }}/providers/Microsoft.ContainerRegistry/registries/${{ parameters.acr }}"}'
      dockerFile: config/dockerfiles/Dockerfile
      additionalImageTags: ${{ parameters.commitHash }}
      imageName: ${{ parameters.image }}
      includeSourceTags: false
      includeLatestTag: true
      defaultContext: false
      context: .
      timeout: "0"
      buildArguments: |
        APP_VERSION=${{ parameters.commitHash }}
        BASE_VERSION=${{ parameters.baseVersion }}

  - task: Docker@0
    displayName: "Push an image"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      azureContainerRegistry: '{"loginServer":"${{ parameters.acr }}.azurecr.io", "id" : "/subscriptions/${{ parameters.acrSubscription }}/resourceGroups/${{ parameters.group }}/providers/Microsoft.ContainerRegistry/registries/${{ parameters.acr }}"}'
      action: "Push an image"
      imageName: ${{ parameters.image }}
      additionalImageTags: ${{ parameters.commitHash }}
      includeSourceTags: false
      includeLatestTag: true

  - task: AzureCLI@2
    displayName: "ensure staging is stopped"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        az webapp stop \
          -g ${{ parameters.group }} \
          -n ${{ parameters.appname }} \
          --slot staging

  - task: AzureWebAppContainer@1
    displayName: "Deploy container to web app"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      appName: ${{ parameters.appname }}
      deployToSlotOrASE: true
      slotName: staging
      resourceGroupName: ${{ parameters.group }}
      containers: ${{ parameters.acr }}.azurecr.io/${{ parameters.image }}:${{ parameters.commitHash }}


  - task: AzureCLI@2
    displayName: "ensure staging is started"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      timeout: "300"
      inlineScript: |
        az webapp start \
          -g ${{ parameters.group }} \
          -n ${{ parameters.appname }} \
          --slot staging

  - task: CmdLine@2
    displayName: "wait for staging to be up"
    inputs:
      script: |
        HTTPD=`curl -A "Web Check" -sL --connect-timeout 3 -w "%{http_code}\n" --head "https://${{ parameters.appname }}-staging.azurewebsites.net/deploy.php?healthcheck" -o /dev/null`
        TRY=0
        until [ "$HTTPD" == "200" ]; do
          if [ $TRY -gt 10 ]; then
            echo "Site not reachable"
            exit 1
          fi
          printf '.'
          sleep 3
          HTTPD=`curl -A "Web Check" -sL --connect-timeout 3 -w "%{http_code}\n" --head "https://${{ parameters.appname }}-staging.azurewebsites.net/deploy.php?healthcheck" -o /dev/null`
          TRY=$((TRY+1))
        done

  - task: CmdLine@2
    displayName: "Set to maintenance"
    condition: ${{ not(containsValue(split(parameters.skipSteps, ','), 'maint1')) }}
    inputs:
      script: |
        curl --no-progress-meter https://${{ parameters.appname }}-staging.azurewebsites.net/deploy.php?action=maint1  2>&1 | tee deploy.log
        if ! grep -q "DEPLOY OK" "deploy.log"; then
          exit 1
        fi

  - task: CmdLine@2
    displayName: "Run cache clear"
    condition: ${{ not(containsValue(split(parameters.skipSteps, ','), 'cr')) }}
    inputs:
      script: |
        curl --no-progress-meter https://${{ parameters.appname }}-staging.azurewebsites.net/deploy.php?action=cr  2>&1 | tee deploy.log
        if ! grep -q "DEPLOY OK" "deploy.log"; then
          exit 1
        fi

  - task: CmdLine@2
    displayName: "Run get dump"
    condition: ${{ not(containsValue(split(parameters.skipSteps, ','), 'dump')) }}
    inputs:
      script: |
        curl --no-progress-meter https://${{ parameters.appname }}-staging.azurewebsites.net/deploy.php?action=dump  2>&1 | tee deploy.log
        if ! grep -q "DEPLOY OK" "deploy.log"; then
          exit 1
        fi

  - task: CmdLine@2
    displayName: "Run update DB"
    condition: ${{ not(containsValue(split(parameters.skipSteps, ','), 'updb')) }}
    inputs:
      script: |
        curl --no-progress-meter https://${{ parameters.appname }}-staging.azurewebsites.net/deploy.php?action=updb  2>&1 | tee deploy.log
        if ! grep -q "DEPLOY OK" "deploy.log"; then
          exit 1
        fi

  - task: CmdLine@2
    displayName: "Run config import"
    condition: ${{ not(containsValue(split(parameters.skipSteps, ','), 'cim')) }}
    inputs:
      script: |
        curl --no-progress-meter https://${{ parameters.appname }}-staging.azurewebsites.net/deploy.php?action=cim  2>&1 | tee deploy.log
        if ! grep -q "DEPLOY OK" "deploy.log"; then
          exit 1
        fi

  - task: CmdLine@2
    displayName: "Run local update"
    condition: ${{ not(containsValue(split(parameters.skipSteps, ','), 'localupd')) }}
    inputs:
      script: |
        curl --no-progress-meter https://${{ parameters.appname }}-staging.azurewebsites.net/deploy.php?action=localupd  2>&1 | tee deploy.log
        if ! grep -q "DEPLOY OK" "deploy.log"; then
          exit 1
        fi

  - task: AzureCLI@2
    displayName: "Swap slots"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        az webapp deployment slot swap \
          -g ${{ parameters.group }} \
          -n ${{ parameters.appname }} \
          --slot staging \
          --target-slot production

  - task: CmdLine@2
    displayName: "Set maintenance to 0"
    condition: ${{ not(containsValue(split(parameters.skipSteps, ','), 'maint0')) }}
    inputs:
      script: |
        curl --no-progress-meter https://${{ parameters.appname }}.azurewebsites.net/deploy.php?action=maint0  2>&1 | tee deploy.log
        if ! grep -q "DEPLOY OK" "deploy.log"; then
          exit 1
        fi

  - task: CmdLine@2
    displayName: "Run cache clear"
    condition: ${{ not(containsValue(split(parameters.skipSteps, ','), 'cr')) }}
    inputs:
      script: |
        curl --no-progress-meter https://${{ parameters.appname }}.azurewebsites.net/deploy.php?action=cr  2>&1 | tee deploy.log
        if ! grep -q "DEPLOY OK" "deploy.log"; then
          exit 1
        fi

  - task: CmdLine@2
    displayName: "Delete deployment script"
    condition: ${{ not(containsValue(split(parameters.skipSteps, ','), 'rm')) }}
    inputs:
      script: |
        curl --no-progress-meter https://${{ parameters.appname }}.azurewebsites.net/deploy.php?action=rm  2>&1 | tee deploy.log
        if ! grep -q "DEPLOY OK" "deploy.log"; then
          exit 1
        fi

  - task: AzureCLI@2
    displayName: "ensure staging is stopped"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        az webapp stop \
          -g ${{ parameters.group }} \
          -n ${{ parameters.appname }} \
          --slot staging

  - task: AzureCli@2
    displayName: "notify"
    env:
      SLACK_WEBHOOK: ${{ parameters.slackWebhook }}
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        case "$SLACK_WEBHOOK" in
          https://*) ;;
          \$\(*) echo "##vso[task.logissue type=warning]slackWebhook non définie pour cette pipeline (nom, emplacement, variable group ou rerun d'un ancien run) : notification Slack ignorée."; exit 0 ;;
          *) echo "##vso[task.logissue type=warning]slackWebhook définie mais invalide (longueur ${#SLACK_WEBHOOK}, doit commencer par https://) : notification Slack ignorée."; exit 0 ;;
        esac
        MSG=$(echo "$(Build.SourceVersionMessage)" | tr -d "'")
        curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"Site déployé en ${{replace(variables['Build.SourceBranch'], 'refs/heads/', '') }} version ${{ parameters.commitHash }}\n${MSG}\"}" \
          "$SLACK_WEBHOOK"

  - task: AzureCli@2
    displayName: "Send Slack notification on failure"
    env:
      SLACK_WEBHOOK: ${{ parameters.slackWebhook }}
    condition: or(failed(), canceled())
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        case "$SLACK_WEBHOOK" in
          https://*) ;;
          \$\(*) echo "##vso[task.logissue type=warning]slackWebhook non définie pour cette pipeline (nom, emplacement, variable group ou rerun d'un ancien run) : notification Slack ignorée."; exit 0 ;;
          *) echo "##vso[task.logissue type=warning]slackWebhook définie mais invalide (longueur ${#SLACK_WEBHOOK}, doit commencer par https://) : notification Slack ignorée."; exit 0 ;;
        esac
        MSG=$(echo "$(Build.SourceVersionMessage)" | tr -d "'")
        curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"Pipeline $(Build.DefinitionName) for ${MSG} failed. See details: $(Build.BuildUri)\"}" \
          "$SLACK_WEBHOOK"
      waitForCompletion: "false"
