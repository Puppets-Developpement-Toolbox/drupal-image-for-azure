# v20261009 deploy-multistep-drupal11

parameters:
  - name: group
    type: string
  - name: subscription
    type: string
  - name: image
    type: string
  - name: appname
    type: string
  - name: acr
    type: string
  - name: acrSubscription
    type: string
  - name: commitHash
    type: string
  - name: slackWebhook
    type: string
  - name: skipSteps
    type: string
    default: ''
  - name: baseVersion
    type: string
    default: deploy-multistep-drupal11@sha256:ae63b184c54af114b5e36c43361df1c767ff8fcebcfcfbef9ba2692b1a7ee78e
  # Séquence deploy.php, dans l'ordre. slots : premier slot qui répond
  # « DEPLOY OK ». skip : nom à donner dans skipSteps (par défaut l'action).
  - name: deploySteps
    type: object
    default:
      - { action: maint1, slots: [staging], label: "Set to maintenance" }
      - { action: cr, slots: [staging], label: "Run cache clear" }
      - { action: dump, slots: [staging], label: "Run get dump" }
      - { action: updb, slots: [staging], label: "Run update DB" }
      - { action: cim, slots: [staging], label: "Run config import" }
      - { action: localupd, slots: [staging], label: "Run local update" }
      - { action: swap, label: "Swap slots" }
      - { action: maint0, slots: [production], label: "Set maintenance to 0" }
      - { action: cr, slots: [production], label: "Run cache clear" }
      - { action: rm, slots: [production], label: "Delete deployment script" }
      # Échec ou annulation : base partagée entre les slots, la prod resterait en
      # maintenance. Le slot staging garde deploy.php tant qu'il n'a pas été basculé.
      - { action: maint0, slots: [staging, production], label: "Leave maintenance after failure", skip: maint1, when: "or(failed(), canceled())" }

steps:
  - task: CmdLine@2
    displayName: "Clean builder"
    inputs:
      script: |
        echo "=== Disque avant nettoyage ==="
        df -h "$(Agent.WorkFolder)" /var/lib/docker 2>/dev/null || df -h
        docker system df
        docker system prune --all --force --volumes
        echo "=== Disque après nettoyage ==="
        df -h "$(Agent.WorkFolder)" /var/lib/docker 2>/dev/null || df -h
        docker system df

  - task: CmdLine@2
    displayName: "Install composer deps (private repos)"
    env:
      GITHUB_TOKEN: $(GITHUB_TOKEN)
      BASE_VERSION: ${{ parameters.baseVersion }}
    inputs:
      script: |
        # Unresolved variable stays as a literal macro string (dollar, parenthesis,
        # name); never write the full macro here or Azure substitutes the secret.
        case "$GITHUB_TOKEN" in
        ""|'$('*)
          echo "##vso[task.logissue type=error]GITHUB_TOKEN variable is not defined in the pipeline (required for composer private repos)." >&2
          exit 1
          ;;
        esac
        # Header sent via stdin (printf is a builtin): token stays out of ps.
        HTTP_CODE=$(printf 'Authorization: Bearer %s\n' "$GITHUB_TOKEN" | \
          curl -s -o /dev/null -w '%{http_code}' -H @- \
          https://api.github.com/user) || HTTP_CODE=000
        if [ "$HTTP_CODE" != "200" ]; then
          echo "##vso[task.logissue type=error]GITHUB_TOKEN is invalid or expired (GitHub API returned HTTP $HTTP_CODE)." >&2
          exit 1
        fi
        BASE_IMAGE="ghcr.io/puppets-developpement-toolbox/drupal-azure-base:$BASE_VERSION"
        COMPOSER_CACHE="${AGENT_WORKFOLDER:-$HOME}/.cache/composer-build"
        mkdir -p "$COMPOSER_CACHE"
        # Passed by name only: keeps the token out of the process list.
        export COMPOSER_AUTH="{\"github-oauth\":{\"github.com\":\"$GITHUB_TOKEN\"}}"
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          --entrypoint composer \
          -e HOME=/tmp \
          -v "$PWD:/build" -w /build \
          -v "$COMPOSER_CACHE:/tmp/composer-cache" \
          -e COMPOSER_CACHE_DIR=/tmp/composer-cache \
          -e COMPOSER_AUTH \
          "$BASE_IMAGE" \
          install --no-dev -o --no-progress --prefer-dist

  - task: Docker@0
    displayName: Build
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      azureContainerRegistry: '{"loginServer":"${{ parameters.acr }}.azurecr.io", "id" : "/subscriptions/${{ parameters.acrSubscription }}/resourceGroups/${{ parameters.group }}/providers/Microsoft.ContainerRegistry/registries/${{ parameters.acr }}"}'
      dockerFile: config/dockerfiles/Dockerfile
      additionalImageTags: ${{ parameters.commitHash }}
      imageName: ${{ parameters.image }}
      includeSourceTags: false
      includeLatestTag: true
      defaultContext: false
      context: .
      timeout: "0"
      buildArguments: |
        APP_VERSION=${{ parameters.commitHash }}
        BASE_VERSION=${{ parameters.baseVersion }}

  - task: Docker@0
    displayName: "Push an image"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      azureContainerRegistry: '{"loginServer":"${{ parameters.acr }}.azurecr.io", "id" : "/subscriptions/${{ parameters.acrSubscription }}/resourceGroups/${{ parameters.group }}/providers/Microsoft.ContainerRegistry/registries/${{ parameters.acr }}"}'
      action: "Push an image"
      imageName: ${{ parameters.image }}
      additionalImageTags: ${{ parameters.commitHash }}
      includeSourceTags: false
      includeLatestTag: true

  - task: AzureCLI@2
    displayName: "ensure staging is stopped"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        az webapp stop \
          -g ${{ parameters.group }} \
          -n ${{ parameters.appname }} \
          --slot staging

  - task: AzureWebAppContainer@1
    displayName: "Deploy container to web app"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      appName: ${{ parameters.appname }}
      deployToSlotOrASE: true
      slotName: staging
      resourceGroupName: ${{ parameters.group }}
      containers: ${{ parameters.acr }}.azurecr.io/${{ parameters.image }}:${{ parameters.commitHash }}


  - task: AzureCLI@2
    displayName: "ensure staging is started"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      timeout: "300"
      inlineScript: |
        az webapp start \
          -g ${{ parameters.group }} \
          -n ${{ parameters.appname }} \
          --slot staging

  - task: CmdLine@2
    displayName: "wait for staging to be up"
    env:
      DEPLOY_TOKEN: $(DEPLOY_TOKEN)
      HOST: ${{ parameters.appname }}-staging.azurewebsites.net
    inputs:
      script: |
        # 12 essais espacés de 3 s. En-tête lu sur stdin : jeton hors de la liste des processus.
        # Pas de -L : curl renverrait X-Deploy-Token à l'hôte cible d'une redirection.
        for TRY in $(seq 12); do
          HTTPD=$(printf 'X-Deploy-Token: %s\n' "$DEPLOY_TOKEN" | \
            curl -A "Web Check" -s --connect-timeout 3 -w "%{http_code}" --head -H @- -o /dev/null \
            "https://$HOST/deploy.php?healthcheck")
          [ "$HTTPD" = "200" ] && exit 0
          printf '.'
          sleep 3
        done
        echo "Site not reachable (HTTP $HTTPD, 403 = jeton DEPLOY_TOKEN refusé)"
        exit 1

  # Jeton DEPLOY_TOKEN (variable secrète Azure DevOps) envoyé en en-tête X-Deploy-Token.
  - ${{ each step in parameters.deploySteps }}:
    - ${{ if eq(step.action, 'swap') }}:
      - task: AzureCLI@2
        displayName: ${{ step.label }}
        inputs:
          azureSubscription: ${{ parameters.subscription }}
          scriptType: "bash"
          scriptLocation: "inlineScript"
          inlineScript: |
            az webapp deployment slot swap \
              -g ${{ parameters.group }} \
              -n ${{ parameters.appname }} \
              --slot staging \
              --target-slot production
    - ${{ else }}:
      - task: CmdLine@2
        displayName: ${{ step.label }}
        condition: and(${{ coalesce(step.when, 'succeeded()') }}, ${{ not(containsValue(split(parameters.skipSteps, ','), coalesce(step.skip, step.action))) }})
        env:
          DEPLOY_TOKEN: $(DEPLOY_TOKEN)
          APPNAME: ${{ parameters.appname }}
          SLOTS: ${{ join(' ', step.slots) }}
          ACTION: ${{ step.action }}
        inputs:
          script: |
            case "$DEPLOY_TOKEN" in
              ""|'$('*)
                echo "##vso[task.logissue type=warning]DEPLOY_TOKEN non défini : deploy.php appelé sans jeton."
                DEPLOY_TOKEN=""
                ;;
            esac
            for SLOT in $SLOTS; do
              HOST=$APPNAME
              [ "$SLOT" = production ] || HOST="$HOST-$SLOT"
              # En-tête lu sur stdin (printf est un builtin) : jeton hors de la liste des processus et des logs.
              printf 'X-Deploy-Token: %s\n' "$DEPLOY_TOKEN" | \
                curl --no-progress-meter -H @- "https://$HOST.azurewebsites.net/deploy.php?action=$ACTION" 2>&1 | tee deploy.log
              grep -q "DEPLOY OK" deploy.log && exit 0
            done
            exit 1

  - task: AzureCLI@2
    displayName: "ensure staging is stopped"
    # Même après un échec : le slot staging ne reste pas en ligne avec deploy.php.
    condition: always()
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        az webapp stop \
          -g ${{ parameters.group }} \
          -n ${{ parameters.appname }} \
          --slot staging

  - task: AzureCli@2
    displayName: "notify"
    env:
      SLACK_WEBHOOK: ${{ parameters.slackWebhook }}
      # Message de commit passé par l'environnement : jamais interprété par bash.
      COMMIT_MESSAGE: $(Build.SourceVersionMessage)
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        case "$SLACK_WEBHOOK" in
          https://*) ;;
          \$\(*) echo "##vso[task.logissue type=warning]slackWebhook non définie pour cette pipeline (nom, emplacement, variable group ou rerun d'un ancien run) : notification Slack ignorée."; exit 0 ;;
          *) echo "##vso[task.logissue type=warning]slackWebhook définie mais invalide (longueur ${#SLACK_WEBHOOK}, doit commencer par https://) : notification Slack ignorée."; exit 0 ;;
        esac
        # Échappement JSON (antislash, guillemet, retours ligne, tabulation).
        MSG=${COMMIT_MESSAGE//\\/\\\\}
        MSG=${MSG//\"/\\\"}
        MSG=${MSG//$'\r'/}
        MSG=${MSG//$'\n'/\\n}
        MSG=${MSG//$'\t'/\\t}
        curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"Site déployé en ${{replace(variables['Build.SourceBranch'], 'refs/heads/', '') }} version ${{ parameters.commitHash }}\n${MSG}\"}" \
          "$SLACK_WEBHOOK"

  - task: AzureCli@2
    displayName: "Send Slack notification on failure"
    env:
      SLACK_WEBHOOK: ${{ parameters.slackWebhook }}
      # Message de commit passé par l'environnement : jamais interprété par bash.
      COMMIT_MESSAGE: $(Build.SourceVersionMessage)
    condition: or(failed(), canceled())
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        case "$SLACK_WEBHOOK" in
          https://*) ;;
          \$\(*) echo "##vso[task.logissue type=warning]slackWebhook non définie pour cette pipeline (nom, emplacement, variable group ou rerun d'un ancien run) : notification Slack ignorée."; exit 0 ;;
          *) echo "##vso[task.logissue type=warning]slackWebhook définie mais invalide (longueur ${#SLACK_WEBHOOK}, doit commencer par https://) : notification Slack ignorée."; exit 0 ;;
        esac
        # Échappement JSON (antislash, guillemet, retours ligne, tabulation).
        MSG=${COMMIT_MESSAGE//\\/\\\\}
        MSG=${MSG//\"/\\\"}
        MSG=${MSG//$'\r'/}
        MSG=${MSG//$'\n'/\\n}
        MSG=${MSG//$'\t'/\\t}
        curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"Pipeline $(Build.DefinitionName) for ${MSG} failed. See details: $(Build.BuildUri)\"}" \
          "$SLACK_WEBHOOK"
      waitForCompletion: "false"
