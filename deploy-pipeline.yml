# v20260403 deploy-multistep

parameters:
  - name: group
    type: string
  - name: subscription
    type: string
  - name: login
    type: string
  - name: image
    type: string
  - name: appname
    type: string
  - name: acr
    type: string
  - name: acrSubscription
    type: string
  - name: commitHash
    type: string
  - name: slackWebhook
    type: string

steps:
  - task: CmdLine@2
    displayName: "Clean builder"
    inputs:
      script: |
        docker system prune --all --force --volumes

  - checkout: self
  - task: Docker@0
    displayName: Build
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      azureContainerRegistry: '{"loginServer":"${{ parameters.acr }}.azurecr.io", "id" : "/subscriptions/${{ parameters.acrSubscription }}/resourceGroups/${{ parameters.group }}/providers/Microsoft.ContainerRegistry/registries/${{ parameters.acr }}"}'
      dockerFile: config/dockerfiles/Dockerfile
      additionalImageTags: ${{ parameters.commitHash }}
      imageName: ${{ parameters.image }}
      includeSourceTags: false
      includeLatestTag: true
      defaultContext: false
      context: .
      timeout: "0"
      buildArguments: |
        APP_VERSION=${{ parameters.commitHash }}

  - task: Docker@0
    displayName: "Push an image"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      azureContainerRegistry: '{"loginServer":"${{ parameters.acr }}.azurecr.io", "id" : "/subscriptions/${{ parameters.acrSubscription }}/resourceGroups/${{ parameters.group }}/providers/Microsoft.ContainerRegistry/registries/${{ parameters.acr }}"}'
      action: "Push an image"
      imageName: ${{ parameters.image }}
      additionalImageTags: ${{ parameters.commitHash }}
      includeSourceTags: false
      includeLatestTag: true

  - task: AzureCLI@2
    displayName: "ensure staging is stopped"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        az webapp stop \
          -g ${{ parameters.group }} \
          -n ${{ parameters.appname }} \
          --slot staging

  - task: AzureCLI@2
    displayName: "Deploy container to web app"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        az login --identity --username ${{ parameters.login }}
        az webapp config container set \
          --name ${{ parameters.appname }} \
          --resource-group ${{ parameters.group }} \
          --container-image-name ${{ parameters.acr }}.azurecr.io/${{ parameters.image }}:${{ parameters.commitHash }} \
          --container-registry-url https://${{ parameters.acr }}.azurecr.io \
          --slot staging

  - task: AzureCLI@2
    displayName: "ensure staging is started"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      timeout: "300"
      inlineScript: |
        az webapp start \
          -g ${{ parameters.group }} \
          -n ${{ parameters.appname }} \
          --slot staging

  - task: CmdLine@2
    displayName: "wait for staging to be up"
    inputs:
      script: |
        HTTPD=`curl -A "Web Check" -sL --connect-timeout 3 -w "%{http_code}\n" --head "https://${{ parameters.appname }}-staging.azurewebsites.net/deploy.php?healthcheck" -o /dev/null`
        TRY=0
        until [ "$HTTPD" == "200" ]; do
          if [ $TRY -gt 10 ]; then
            echo "Site not reachable"
            exit 1
          fi
          printf '.'
          sleep 3
          HTTPD=`curl -A "Web Check" -sL --connect-timeout 3 -w "%{http_code}\n" --head "https://${{ parameters.appname }}-staging.azurewebsites.net/deploy.php?healthcheck" -o /dev/null`
          TRY=$((TRY+1))
        done

  - task: CmdLine@2
    displayName: "Set to maintenance"
    inputs:
      script: |
        curl --no-progress-meter https://${{ parameters.appname }}-staging.azurewebsites.net/deploy.php?action=maint1  2>&1 | tee deploy.log
        if ! grep -q "DEPLOY OK" "deploy.log"; then
          exit 1
        fi

  - task: CmdLine@2
    displayName: "Run get dump"
    inputs:
      script: |
        source config/deploy/curl-retry.sh
        deploy_call dump "https://${{ parameters.appname }}-staging.azurewebsites.net"

  - task: CmdLine@2
    displayName: "Run update DB"
    inputs:
      script: |
        source config/deploy/curl-retry.sh
        deploy_call updb "https://${{ parameters.appname }}-staging.azurewebsites.net"

  - task: CmdLine@2
    displayName: "Run config import"
    inputs:
      script: |
        source config/deploy/curl-retry.sh
        deploy_call cim "https://${{ parameters.appname }}-staging.azurewebsites.net"

  - task: CmdLine@2
    displayName: "Run local update"
    inputs:
      script: |
        source config/deploy/curl-retry.sh
        deploy_call localupd "https://${{ parameters.appname }}-staging.azurewebsites.net"

  - task: AzureCLI@2
    displayName: "Swap slots"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        az webapp deployment slot swap \
          -g ${{ parameters.group }} \
          -n ${{ parameters.appname }} \
          --slot staging \
          --target-slot production

  - task: CmdLine@2
    displayName: "Set maintenance to 0"
    inputs:
      script: |
        source config/deploy/curl-retry.sh
        deploy_call maint0 "https://${{ parameters.appname }}-staging.azurewebsites.net"

  - task: CmdLine@2
    displayName: "Run cache clear"
    inputs:
      script: |
        source config/deploy/curl-retry.sh
        deploy_call cr "https://${{ parameters.appname }}-staging.azurewebsites.net"

  - task: CmdLine@2
    displayName: "Run version"
    inputs:
      script: |
        source config/deploy/curl-retry.sh
        deploy_call ver "https://${{ parameters.appname }}-staging.azurewebsites.net"

  - task: CmdLine@2
    displayName: "Delete deployment script"
    inputs:
      script: |
        source config/deploy/curl-retry.sh
        deploy_call rm "https://${{ parameters.appname }}-staging.azurewebsites.net"

  - task: AzureCLI@2
    displayName: "ensure staging is stopped"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        az webapp stop \
          -g ${{ parameters.group }} \
          -n ${{ parameters.appname }} \
          --slot staging

  - task: AzureCli@2
    displayName: "notify"
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        BRANCH=$(echo "$(Build.SourceBranch)" | sed 's|refs/heads/||')
        MESSAGE=$(jq -n \
          --arg text "Site déployé en ${BRANCH} version ${{ parameters.commitHash }}\n$(Build.SourceVersionMessage)" \
          '{text: $text}')
        curl -X POST -H 'Content-type: application/json' \
          --data "$MESSAGE" \
          ${{ parameters.slackWebhook }}

  - task: AzureCli@2
    displayName: "Send Slack notification on failure"
    condition: or(failed(), canceled())
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        MESSAGE=$(jq -n \
          --arg text "Pipeline $(Build.DefinitionName) for $(Build.SourceVersionMessage) failed. See details: $(Build.BuildUri)" \
          '{text: $text}')
        curl -X POST -H 'Content-type: application/json' \
          --data "$MESSAGE" \
          ${{ parameters.slackWebhook }}
      waitForCompletion: "false"
