# Dependabot reads this file from the default branch (main) only.
# Each target branch has its own Dockerfile (Drupal 10 vs 11), hence one entry per branch.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "deploy-multistep"
    schedule:
      interval: "daily"
    # Default Dependabot cooldown delays freshly republished images. TEMP 0 to test the chain; set back to 1 after.
    cooldown:
      default-days: 0
    ignore:
      # Drupal 10 branch: never propose drupal:11 here (migration is done on deploy-multistep-drupal11)
      - dependency-name: "drupal"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "deploy-multistep-drupal11"
    schedule:
      interval: "daily"
    # Default Dependabot cooldown delays freshly republished images. TEMP 0 to test the chain; set back to 1 after.
    cooldown:
      default-days: 0
